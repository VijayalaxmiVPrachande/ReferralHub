spring.application.name=JobReferralAndInternalHiringPlatform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/referral_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
app.recruiter.invite-code=${APP_RECRUITER_INVITE_CODE}
server.port=${PORT:${SERVER_PORT:8080}}

# Mailer Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Multipart Upload Limits (max 5 MB for resumes)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Application specific properties
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080}
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.company.name=${APP_COMPANY_NAME:ReferralHub}
app.recruiter.invite-code=${APP_RECRUITER_INVITE_CODE:RECRUITER2026}
app.demo.password=${DEMO_PASSWORD:DemoPassword123!}