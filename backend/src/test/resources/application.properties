spring.application.name=JobReferralAndInternalHiringPlatformTest

# In-Memory H2 Database for fast, isolated tests
spring.datasource.url=jdbc:h2:mem:referral_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Mailer (for auto-configuration of JavaMailSender)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=testpassword

# Security & JWT
jwt.secret=test_jwt_secret_must_have_at_least_32_characters_length!
jwt.expiration-ms=86400000

# App properties
app.cors.origins=http://localhost:5173,http://localhost:8080
app.upload.dir=target/test-uploads
app.company.name=ReferralHub
app.recruiter.invite-code=TEST_RECRUITER_INVITE
app.demo.password=TestDemoPassword123!
app.seeder.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
